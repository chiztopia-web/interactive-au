<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive iPhone AU</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar gaya iOS */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Container Utama iPhone Frame -->
    <div class="w-full sm:w-[390px] h-screen sm:h-[844px] bg-black sm:rounded-[50px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-[12px] sm:border-slate-800">

        <!-- Status Bar & Dynamic Island (Atas iPhone) -->
        <div class="bg-transparent text-white px-7 py-3 flex justify-between items-center text-xs font-semibold z-50 select-none absolute top-0 left-0 right-0">
            <span id="clock" class="text-sm font-bold">12:00</span>
            <!-- Dynamic Island / Notch -->
            <div class="w-28 h-7 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2 flex items-center justify-between px-2.5">
                <div class="w-2.5 h-2.5 bg-blue-900 rounded-full opacity-60"></div>
                <div class="w-3 h-3 bg-slate-950 rounded-full"></div>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="text-[10px]">5G</span>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h15.3l-.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.66-.59 3.18-1.57 4.38l-.43-.43C18.42 14.65 19 13.39 19 12c0-3.87-3.13-7-7-7zm0 3a4 4 0 100 8 4 4 0 000-8z"/></svg>
                <span class="text-[10px]">100%</span>
            </div>
        </div>

        <!-- ================= CONTENT AREA ================= -->
        <div class="flex-1 relative overflow-hidden flex flex-col bg-slate-950">

            <!-- 1. LOCK SCREEN (PIN KODE: 2504) -->
            <div id="lock-screen" class="absolute inset-0 flex flex-col justify-between p-8 bg-cover bg-center z-40 transition-all duration-500" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop');">
                <div class="text-white text-center mt-16">
                    <svg class="w-7 h-7 mx-auto mb-2 text-slate-200" fill="none" stroke="currentColor" stroke
